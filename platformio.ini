; PlatformIO Project Configuration File
;
; Flashing:
;   ./flash.sh          build + flash over USB serial (default)
;   ./flash.sh ota      build + flash over WiFi (ArduinoOTA, WordClock.lan)
;
; Visit https://docs.platformio.org/page/projectconf.html for more options.

[platformio]
default_envs = d1_mini_lite

[env]
platform = espressif8266
board = d1_mini_lite
framework = arduino

[env:d1_mini_lite]
; default: build + flash over USB serial

[env:d1_mini_lite_ota]
; flash over WiFi; requires the device to run an OTA-capable firmware.
; WORDCLOCK_OTA_PASSWORD is exported by flash.sh (read from include/secrets.h)
upload_protocol = espota
upload_port = WordClock.lan
upload_flags = --auth=${sysenv.WORDCLOCK_OTA_PASSWORD}
